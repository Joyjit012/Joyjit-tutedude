<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Js DOM & Event Handeling</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="toplevel" id="toplevel">
        <div class="text">
          <p id="greeting" ></p>
        </div>
      </div>

      <div class="midlevel" >
        <div class="box">
          <p>Red</p>
        </div>
        <div class="box">
          <p>Yellow</p>
        </div>

        <div class="box">
          <p>Green</p>
        </div>

        <div class="box">
          <p>Blue</p>
        </div>
      </div>

      <div class="footer">
        <div class="search">
          <input
            type="text"
            id="enterName"
            placeholder="Enter Your Name"
            required
          />
          <button id="searchBtn">Greet</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
